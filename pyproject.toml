[project]
name = "fulcrum"
version = "0.1.0"
description = "Fulcrum — match intelligence that explains the moments a game turns on"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "numpy>=1.26",
  "scipy>=1.13",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
azure = [
  "aiokafka>=0.11",            # Event Hubs Kafka endpoint
  "azure-identity>=1.17",
  "agent-framework",            # Microsoft Agent Framework (may need --prerelease=allow)
  "azure-monitor-opentelemetry>=1.6",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fulcrum"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
